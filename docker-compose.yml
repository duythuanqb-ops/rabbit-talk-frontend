services:
  web:
    profiles: [prod]
    container_name: nextjs_frontend
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "${PORT:-3004}:${PORT:-3004}"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      - PORT=${PORT:-3004}
    command: node server.js

  web-dev:
    container_name: nextjs_frontend_dev
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${PORT:-3004}:${PORT:-3004}"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - PORT=${PORT:-3004}
    command: sh -c "npm install && npm run dev -- -p ${PORT:-3004}"

  web-prod:
    profiles: [prod-standalone]
    container_name: nextjs_frontend_prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
    restart: always

volumes:
  frontend_node_modules:
  frontend_next:
